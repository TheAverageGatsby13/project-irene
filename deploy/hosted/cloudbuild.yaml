# Build only. This configuration never deploys or changes IAM.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'deploy/hosted/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/irene/backend:$BUILD_ID', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/irene/backend:$BUILD_ID'
substitutions:
  _REGION: asia-south1
options:
  logging: CLOUD_LOGGING_ONLY
