# Copy to ignored deploy/hosted/env.yaml; replace these non-secret placeholders.
SPRING_PROFILES_ACTIVE: hosted
SUPABASE_POOLER_HOST: COPY_SESSION_POOLER_HOST_FROM_SUPABASE
DATABASE_USER: irene_app.YOUR_SUPABASE_PROJECT_REF
CORS_ALLOWED_ORIGINS: https://YOUR_FIREBASE_PROJECT_ID.web.app,https://YOUR_FIREBASE_PROJECT_ID.firebaseapp.com
# Starting candidate, not a clinical recommendation. Check live access and evals.
GEMINI_MODEL: gemini-3.5-flash-lite
GEMINI_EMBEDDING_MODEL: gemini-embedding-001
# First deployment only: set the administrator's real sign-in email in the private copy.
# BOOTSTRAP_ADMIN_EMAIL: YOUR_ADMIN_EMAIL
# DATABASE_PASSWORD, APP_JWT_SECRET, GEMINI_API_KEY and bootstrap password
# are injected from Secret Manager, never written in this YAML.
