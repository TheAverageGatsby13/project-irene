# Copy to a private local file and replace placeholders before deploying.
SPRING_PROFILES_ACTIVE: cloud
GOOGLE_CLOUD_PROJECT: YOUR_PROJECT_ID
GOOGLE_CLOUD_LOCATION: global
GOOGLE_EMBEDDING_LOCATION: us-central1
GEMINI_MODEL: gemini-3.8-flash
GEMINI_EMBEDDING_MODEL: gemini-embedding-001
DATABASE_USER: irene_app
DATABASE_URL: 'jdbc:postgresql:///irene?cloudSqlInstance=YOUR_PROJECT_ID:asia-south1:irene-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlRefreshStrategy=lazy'
SEED_DATA: 'false'
