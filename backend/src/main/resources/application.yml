spring:
  application:
    name: project-irene
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: 240
  ai:
    mode: ${AI_MODE:mock}
    provider: ${GOOGLE_AI_PROVIDER:gemini}
    project-id: ${GOOGLE_CLOUD_PROJECT:}
    location: ${GOOGLE_CLOUD_LOCATION:global}
    embedding-location: ${GOOGLE_EMBEDDING_LOCATION:us-central1}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.8-flash}
    gemini-embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    gemini-base-url: https://generativelanguage.googleapis.com/v1beta
    timeout-seconds: 20
  seed-data: ${SEED_DATA:false}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
