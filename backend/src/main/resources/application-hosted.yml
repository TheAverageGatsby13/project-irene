# Firebase Hosting -> authenticated Spring API -> Supabase session pooler.
# Never combine this profile with local or demo.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SUPABASE_POOLER_HOST}:5432/postgres?sslmode=verify-full&sslrootcert=${SUPABASE_CA_PATH:/var/run/secrets/supabase/ca.crt}&currentSchema=irene&connectTimeout=10&socketTimeout=30&tcpKeepAlive=true&ApplicationName=irene
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: irene
  flyway:
    default-schema: irene
    schemas: irene
    create-schemas: false
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  seed-data: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${APP_JWT_SECRET}
  ai:
    mode: google
    provider: gemini
    gemini-api-key: ${GEMINI_API_KEY}
    gemini-model: ${GEMINI_MODEL}
    gemini-embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
